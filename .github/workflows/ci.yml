name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 21 is the lowest Java we support, 25 is the current LTS.
        java: [21, 25]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify
        shell: bash

  # Proves the release build (sources, javadoc) works, without signing or uploading anything.
  release-dry-run:
    name: Release profile (no signing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build sources and javadoc jars
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease -Dgpg.skip=true -DskipTests verify
